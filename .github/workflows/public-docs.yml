name: Public documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  current-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-public-docs.py
      - run: python3 -m unittest tests.unit.test_model_download_dispatch tests.unit.test_operational_helpers
